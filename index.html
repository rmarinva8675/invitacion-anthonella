<script>
(function () {
  var SECONDS = 7;      // segundos que dura cada escena
  var AUTOPLAY = true;  // false = solo avanza al tocar
  var LAST = 7;

  var stage = document.getElementById('stage');
  var slot = document.getElementById('slot');
  var cover = document.getElementById('cover');
  var navbar = document.getElementById('navbar');
  var dotsEl = document.getElementById('dots');
  var mbtn = document.getElementById('music');
  var mOn = document.getElementById('mOn');
  var mOff = document.getElementById('mOff');

  var scene = 0, opened = false, timer = null;
  var ctx = null, master = null, beat = 0, step = 0, mt = null, musicOn = false;

  function fit() {
    var s = Math.min(window.innerWidth / 540, window.innerHeight / 960);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  var dots = [];
  for (var i = 0; i < 8; i++) {
    (function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'nav';
      b.setAttribute('aria-label', 'Ir a la escena ' + (n + 1));
      var d = document.createElement('span');
      d.className = 'dot';
      b.appendChild(d);
      b.addEventListener('click', function () { show(n); });
      dotsEl.appendChild(b);
      dots.push(d);
    })(i);
  }

  function show(n) {
    scene = ((n % 8) + 8) % 8;
    var tpl = document.getElementById('t' + scene);
    slot.replaceChildren(tpl.content.cloneNode(true));
    for (var i = 0; i < dots.length; i++) dots[i].className = 'dot' + (i === scene ? ' on' : '');
    clearTimeout(timer);
    if (AUTOPLAY && scene < LAST) {
      timer = setTimeout(function () { show(scene + 1); }, SECONDS * 1000);
    }
  }

  document.getElementById('prev').addEventListener('click', function () { show(scene - 1); });
  document.getElementById('next').addEventListener('click', function () { show(scene + 1); });
  document.addEventListener('keydown', function (e) {
    if (!opened) return;
    if (e.key === 'ArrowRight') show(scene + 1);
    if (e.key === 'ArrowLeft') show(scene - 1);
  });

  var tx = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (tx === null || !opened) return;
    var dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 60) show(dx < 0 ? scene + 1 : scene - 1);
  }, { passive: true });

  /* ---------- Música (nana original generada en el navegador) ---------- */
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function note(freq, t, dur, vol, type, att) {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (att || 0.015));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master);
    var o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  var chords = [
    { bass: 48, arp: [60, 64, 67] },
    { bass: 45, arp: [60, 64, 69] },
    { bass: 41, arp: [60, 65, 69] },
    { bass: 43, arp: [59, 62, 67] }
  ];
  var mel = [
    [79, 0, 76], [76, 0, 81], [77, 0, 81], [79, 0, 74],
    [76, 79, 84], [81, 0, 76], [77, 76, 72], [74, 0, 0]
  ];

  function sched() {
    if (!ctx || !master) return;
    var spb = 0.9;
    while (beat < ctx.currentTime + 1.5) {
      var t = beat;
      var bar = Math.floor(step / 3);
      var b = step % 3;
      var c = chords[bar % 4];
      if (b === 0) {
        note(mtof(c.bass), t, 3.2, 0.22, 'sine');
        for (var k = 0; k < 3; k++) note(mtof(c.arp[k] - 12), t, 3.2, 0.05, 'triangle', 0.6);
      }
      var a = mtof(c.arp[b]);
      note(a, t, 2.2, 0.16, 'triangle');
      note(a * 2, t, 1.2, 0.04, 'sine');
      var m = mel[bar % 8][b];
      if (m) {
        var f = mtof(m);
        note(f, t, 2.6, 0.12, 'sine');
        note(f * 2.76, t, 0.7, 0.025, 'sine');
      }
      beat += spb;
      step += 1;
    }
  }

  function startMusic() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = ctx || new AC();
      if (ctx.state === 'suspended') ctx.resume();
      master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 1.5);
      var delay = ctx.createDelay();
      delay.delayTime.value = 0.38;
      var fb = ctx.createGain();
      fb.gain.value = 0.35;
      var wet = ctx.createGain();
      wet.gain.value = 0.35;
      master.connect(ctx.destination);
      master.connect(delay);
      delay.connect(fb);
      fb.connect(delay);
      delay.connect(wet);
      wet.connect(ctx.destination);
      beat = ctx.currentTime + 0.2;
      step = 0;
      clearInterval(mt);
      mt = setInterval(sched, 250);
      sched();
      return true;
    } catch (e) { return false; }
  }

  function stopMusic() {
    clearInterval(mt);
    var m = master;
    if (ctx && m) {
      try {
        m.gain.cancelScheduledValues(ctx.currentTime);
        m.gain.setValueAtTime(Math.max(m.gain.value, 0.0001), ctx.currentTime);
        m.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      } catch (e) {}
      setTimeout(function () { try { m.disconnect(); } catch (e) {} }, 900);
    }
    master = null;
  }

  function setMusic(on) {
    if (on) { musicOn = startMusic(); } else { stopMusic(); musicOn = false; }
    mOn.hidden = !musicOn;
    mOff.hidden = musicOn;
    mbtn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
    mbtn.setAttribute('aria-label', musicOn ? 'Silenciar la música' : 'Activar la música');
  }
  mbtn.addEventListener('click', function () { setMusic(!musicOn); });

  document.addEventListener('visibilitychange', function () {
    if (!ctx || !musicOn) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  /* ---------- Portada: el toque en "Abrir invitación" inicia música y secuencia ---------- */
  document.getElementById('open').addEventListener('click', function () {
    if (opened) return;
    opened = true;
    setMusic(true);
    mbtn.hidden = false;
    navbar.hidden = false;
    cover.style.opacity = '0';
    cover.style.pointerEvents = 'none';
    setTimeout(function () { cover.hidden = true; }, 700);
    show(0);
  });
})();
</script>
